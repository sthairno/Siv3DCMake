name: Build
run-name: Build ${{ inputs.os }} app (${{ inputs.configuration }} build)

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target OS
        type: choice
        options:
          - windows
          - macos
          - linux
      configuration:
        description: Build configuration
        type: choice
        options:
          - debug
          - release
        default: release

jobs:
  build:
    runs-on: ${{ fromJSON('{"windows":"windows-latest","macos":"macos-latest","linux":"ubuntu-24.04"}')[inputs.os] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify Siv3D deb package
        if: ${{ inputs.os == 'linux' }}
        shell: bash
        run: |
          set -euxo pipefail
          curl "https://drive.usercontent.google.com/download?id=1OH0AIiAWX-4136wVmJ9XaqrLi4m8ejR3&confirm=t" -o libsiv3d-dev.deb
          MIME_TYPE=$(file -b --mime-type libsiv3d-dev.deb)
          if [ "$MIME_TYPE" != "application/vnd.debian.binary-package" ]; then
            echo "Unexpected MIME type: ${MIME_TYPE}"
            exit 1
          fi

      - name: Install dependencies
        if: ${{ inputs.os == 'linux' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ./libsiv3d-dev.deb
  
      - name: Download AppImage tools
        id: appimage-tools
        if: ${{ inputs.os == 'linux' }}
        shell: bash
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        run: |
          set -euxo pipefail
          appimagetool_path="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          linuxdeploy_path="${RUNNER_TEMP}/linuxdeploy-x86_64.AppImage"
          curl -L --fail "${APPIMAGETOOL_URL}" -o "${appimagetool_path}"
          curl -L --fail "${LINUXDEPLOY_URL}" -o "${linuxdeploy_path}"
          chmod +x "${appimagetool_path}" "${linuxdeploy_path}"
          {
            echo "appimagetool=${appimagetool_path}"
            echo "linuxdeploy=${linuxdeploy_path}"
          } >> "${GITHUB_OUTPUT}"
  
      - uses: actions/cache@v5
        if: ${{ inputs.os != 'linux' }}
        with:
          path: siv3d/sdk
          key: siv3d-sdk-${{ inputs.os }}-${{ hashFiles('siv3d/platform/*.cmake', 'siv3d/Siv3D.cmake') }}
          restore-keys: |
            siv3d-sdk-${{ inputs.os }}-

      - name: Configure and build
        run: cmake --workflow --preset workflow-${{ inputs.os }}-${{ inputs.configuration }}

      - name: Create AppImage
        if: ${{ inputs.os == 'linux' }}
        shell: bash
        run: |
          set -euxo pipefail
          configuration="${{ inputs.configuration }}"
          build_type="${configuration^}"
          cmake \
            -DAPPIMAGE_LINUXDEPLOY="${{ steps.appimage-tools.outputs.linuxdeploy }}" \
            -DAPPIMAGE_APPIMAGETOOL="${{ steps.appimage-tools.outputs.appimagetool }}" \
            -P "build/${build_type}/GenerateAppImage.cmake"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.os }}-${{ inputs.configuration }}-${{ github.sha }}
          path: App/**
          if-no-files-found: error
